[package]
name = "cargo-semvertag"
description = "cargo-semvertag: print the git-derived SemVer version, or validate Cargo.toml against the latest tag"
keywords = ["semver", "git", "version", "cli"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cargo-semvertag"
path = "src/main.rs"

[dependencies]
semvertag-core = { workspace = true }
semvertag-shell = { workspace = true }
semver = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
