[package]
name = "semvertag-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "cargo-semvertag: validate Cargo.toml version against the latest git tag"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unprofessor/semvertag"
keywords = ["semver", "git", "version", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cargo-semvertag"
path = "src/main.rs"

[dependencies]
semvertag-core = { path = "../semvertag-core", version = "0.1.0" }
semvertag-shell = { path = "../semvertag-shell", version = "0.1.0" }
semver = "1"
toml = "0.8"
lexopt = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
